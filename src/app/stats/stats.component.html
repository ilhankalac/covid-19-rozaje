<section class="stats" *ngIf="view$ | async as view">
  <header class="stats__head">
    <h2 class="section-title">Izabrani period</h2>
    <p class="section-sub">
      Sve ispod filter trake — ove kartice, oba grafikona i tabela — čita isti
      isječak podataka.
    </p>
  </header>

  <p class="stats__empty" *ngIf="!view.hasRows">
    Za izabrani period nema presjeka.
  </p>

  <div class="stats__grid" *ngIf="view.hasRows">
    <app-stat-card
      label="Najviše u periodu"
      icon="arrow_upward"
      [value]="formatNumber(view.summary.peak?.activeCases)"
      unit="aktivnih"
      [note]="formatLongDate(view.summary.peak?.date)"
      [spark]="view.spark"
    ></app-stat-card>

    <app-stat-card
      label="Najmanje u periodu"
      icon="arrow_downward"
      [value]="formatNumber(view.summary.low?.activeCases)"
      unit="aktivnih"
      [note]="formatLongDate(view.summary.low?.date)"
    ></app-stat-card>

    <app-stat-card
      label="Prosjek u periodu"
      icon="show_chart"
      [value]="formatNumber(view.summary.averageAll, 1)"
      unit="aktivnih"
      [note]="
        'Prosjek kroz ' +
        formatNumber(view.summary.recordCount) +
        ' presjeka u periodu.'
      "
    ></app-stat-card>

    <app-stat-card
      label="Promjena kroz period"
      icon="swap_vert"
      [value]="formatSigned(view.summary.totalChange)"
      [delta]="view.summary.totalChange"
      [deltaText]="periodEndpoints(view.summary)"
      [note]="'Od prvog do posljednjeg presjeka u periodu.'"
    ></app-stat-card>
  </div>
</section>
